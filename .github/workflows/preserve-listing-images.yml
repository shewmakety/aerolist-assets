name: Preserve listing images
on:
  push:
    paths:
      - 'image-import/manifests/*.json'
permissions:
  contents: write
concurrency:
  group: listing-image-preservation
  cancel-in-progress: false
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download images concurrently
        run: python3 image-import/preserve.py
      - name: Commit preserved images and receipts
        run: |
          git config user.name "Aerolist Image Import"
          git config user.email "image-import@aerolist.aero"
          git add listings image-import/receipts
          if ! git diff --cached --quiet; then
            git commit -m "Preserve listing images and import receipts"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
